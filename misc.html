<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Misc | Sheng Cheng</title>

    <meta
      name="description"
      content="Photographs, personal notes, music, films and books collected by Sheng Cheng."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="room.css" />
    <link rel="stylesheet" href="responsive.css" />
    <script src="page-transition.js" defer></script>
    <script src="records.js" defer></script>
    <script src="record-config.js" defer></script>
    <script src="misc.js" type="module"></script>
  </head>

  <body id="top" class="misc-page room-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo" aria-label="Sheng Cheng home">SC</a>

        <nav aria-label="Main navigation">
          <a href="index.html">About</a>
          <a href="research.html">Research</a>
          <a href="misc.html" aria-current="page">Misc</a>
          <a href="cv.pdf" target="_blank" rel="noopener noreferrer">CV</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="room-main">
      <header class="room-heading">
        <div>
          <!-- <p class="room-kicker">Misc / a room of my own</p> -->
          <h1>Welcome to <em>My room</em></h1>
        </div>
      </header>
      <div class="room-viewport" aria-label="My room">
        <div class="room-track" id="room-track">
          <section
            class="room-scene photo-scene"
            aria-label="Galleries"
            inert
          >
            <img
              class="room-cutout photo-wall-art"
              src="assets/room/gallery-wall-slim.png"
              alt="Three slim black metal frames arranged at varied heights"
              width="1536"
              height="1024"
            />
            <img
              class="room-cutout barcelona-chair"
              src="assets/room/lounge-chair-orange.png"
              alt="An orange corduroy lounge chair on a chrome base"
            />
            <!-- <p class="room-paper-note">A gallery of little moments.</p> -->
          </section>
          <section
            class="room-scene music-scene"
            aria-label="Record Corner"
          >
            <div class="album-shelf" aria-label="Selected album">
              <div class="album-rest" id="album-rest">
                <div class="shelf-empty" id="shelf-empty">
                  <span aria-hidden="true">♪</span>
                </div>
                <img
                  id="displayed-album"
                  alt=""
                  width="600"
                  height="600"
                  hidden
                />
              </div>
              <span class="shelf-plank" aria-hidden="true"></span>
            </div>
            <div class="turntable-collage">
              <img
                class="room-cutout turntable-art"
                src="assets/room/turntable.png"
                alt="A record cabinet with a turntable and a collection of records"
                width="1536"
                height="1024"
                fetchpriority="high"
              />
              <button
                class="record-cabinet-hotspot"
                id="open-records" aria-label="Pick a record"
                type="button"
                aria-haspopup="dialog"
                aria-controls="record-library"
              >
                <span class="cabinet-cue" aria-hidden="true">Pick a record</span>
              </button>
              <span class="record-motion" aria-hidden="true"><i></i></span>
            </div>
            <div class="turntable-controls">
              <button
                id="room-play"
                class="room-play"
                type="button"
                aria-label="Play a record"
                disabled
              >
                <span id="room-play-symbol" aria-hidden="true">▶</span>
              </button>
              <div>
                <p id="now-playing-title">Nothing on the turntable, yet.</p>
              </div>
            </div>
          </section>
          <section
            class="room-scene book-scene"
            aria-label="Bookshelf"
            inert
          >
            <img
              class="room-cutout bookshelf-art"
              src="assets/room/enetri-v2.png"
              alt="An IKEA ENETRI style open bookshelf with oak shelves and grey metal supports"
              width="1024"
              height="1024"
            />
            <!-- <p class="room-paper-note">A place for favorite stories.</p> -->
          </section>
        </div>
        <button
          class="room-arrow room-arrow-left"
          id="room-prev"
          type="button"
          aria-label="Go to Galleries"
        >
          <span aria-hidden="true">←</span>
        </button>
        <button
          class="room-arrow room-arrow-right"
          id="room-next"
          type="button"
          aria-label="Go to Bookshelf"
        >
          <span aria-hidden="true">→</span>
        </button>
      </div>
      <div class="room-bottom">
        <nav class="room-locations" aria-label="Room areas">
          <button type="button" data-scene="0">Galleries</button
          ><span aria-hidden="true">/</span>
          <button type="button" data-scene="1" aria-current="true">
            Record Corner</button
          ><span aria-hidden="true">/</span>
          <button type="button" data-scene="2">Bookshelf</button>
        </nav>
        <p id="room-status" role="status">
          Press play to listen.
        </p>
      </div>
      <div class="room-audio-panel" id="room-audio-panel" hidden>
        <audio
          id="song-audio"
          controls
          preload="none"
          aria-label="Current song preview"
        ></audio>
        <a
          id="full-song-link"
          href="https://music.apple.com/tw/album/%E5%91%8A%E8%A8%B4%E6%88%91/152200437?i=152203057"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Listen to the full song on Apple Music"
          >Apple Music ↗</a
        >
      </div>
      <noscript
        ><p class="room-noscript">
          Enable JavaScript to explore the room, or <a
            href="https://music.apple.com/tw/album/%E5%91%8A%E8%A8%B4%E6%88%91/152200437?i=152203057"
            >listen to Tell Me on Apple Music</a
          >.
        </p></noscript
      >
    </main>
    <dialog
      id="record-library"
      class="record-library"
      aria-labelledby="library-title"
    >
      <div class="library-header">
        <div>
          <h2 id="library-title">Pick a record.</h2>
        </div>
        <div class="library-header-actions">
          <button id="edit-records" class="library-button library-edit-toggle" type="button" aria-expanded="false" aria-controls="library-pin-panel">
            <svg aria-hidden="true" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="8" width="12" height="9" rx="2"/><path d="M6.5 8V5a3.5 3.5 0 0 1 7 0v3"/></svg>
            <span id="edit-records-label">Edit</span>
          </button>
          <button
            class="library-close"
            id="close-records"
            type="button"
            aria-label="Close record cabinet"
          >
            ×
          </button>
        </div>
      </div>
      <form id="library-pin-panel" class="library-panel" hidden>
        <label for="library-pin">Enter PIN to edit</label>
        <div class="library-form-row">
          <input id="library-pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" placeholder="6-digit PIN" required aria-describedby="library-message" />
          <button class="library-button" type="submit">Unlock</button>
          <button id="cancel-library-pin" class="library-button library-button-quiet" type="button">Cancel</button>
        </div>
      </form>
      <p id="library-edit-note" class="library-help" hidden>↑ ↓ to reorder · Changes save automatically</p>
      <div class="library-feedback" aria-live="polite" aria-atomic="true">
        <p id="library-message" role="status"></p>
        <button id="retry-records" class="library-button library-button-quiet" type="button" hidden>Retry</button>
        <button id="undo-record-delete" class="library-button library-button-quiet" type="button" hidden>Undo</button>
      </div>
      <div class="record-list" id="record-list"></div>
      <div id="library-add-area" class="library-add-area" hidden>
        <button id="add-record" class="library-add-record" type="button" aria-expanded="false" aria-controls="library-search-panel">
          <span aria-hidden="true">＋</span><span>Add a record</span>
        </button>
        <section id="library-search-panel" class="library-panel" aria-label="Add a record" hidden>
          <div class="library-panel-heading">
            <button id="close-record-search" class="library-button library-button-quiet" type="button">Close</button>
          </div>
          <form id="library-search-form">
            <label class="library-field-label" for="record-search">Search or paste an Apple Music song link</label>
            <div class="library-form-row">
              <input id="record-search" type="search" maxlength="600" placeholder="Song or artist" required />
              <select id="record-storefront" aria-label="Apple Music region">
                <option value="tw">Taiwan</option><option value="us">United States</option><option value="cn">China</option><option value="hk">Hong Kong</option><option value="jp">Japan</option><option value="gb">United Kingdom</option>
              </select>
              <button class="library-button" type="submit">Search</button>
            </div>
          </form>
          <a class="library-apple-link" href="https://music.apple.com/" target="_blank" rel="noopener noreferrer">Browse Apple Music ↗</a>
          <p id="record-search-message" class="library-help" role="status"></p>
          <div id="record-search-results" class="record-search-results"></div>
        </section>
      </div>
      <p class="library-footnote">
        Apple Music previews · Continuous play
      </p>
    </dialog>
    <footer><p>© 2026 Sheng Cheng</p></footer>
  </body>
</html>
